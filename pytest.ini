[pytest]

# Where pytest should look for tests:
testpaths = tests
# File pattern for test modules
python_files = test_*.py
markers =
    order: mark test to run in a specific order
    use_to_home: mark tests that need to navigate to home screen before and/or after execution
    real_device: mark tests that require a connected Airtest/Poco device

# Default command-line options:
#  - generate a self-contained HTML report at reports/report.html
addopts =
    -p no:cacheprovider
    --self-contained-html
    --html=reports/report.html
    -s

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format=%H:%M:%S
